# Prefer Bluetooth audio outputs over wired ones, so sound moves to the
# headphones when they connect and falls back to the Scarlett when they
# disconnect (the PulseAudio module-switch-on-connect behaviour).
# Wired outputs sit around 700-1100; this puts Bluetooth above them.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
