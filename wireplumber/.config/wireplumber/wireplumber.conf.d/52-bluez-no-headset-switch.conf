# Keep Bluetooth headphones on high-quality A2DP. By default WirePlumber
# switches to the HSP/HFP headset profile (mono, 16 kHz, call quality)
# whenever an app opens a microphone. Mics here are the Scarlett/webcam,
# so never do that. Pick "Headset Head Unit" manually if a call needs it.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
