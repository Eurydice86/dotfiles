# Make the Scarlett Solo's Input 1 (Mic) the preferred microphone,
# ahead of the webcam, onboard audio and the Bluetooth headset mic.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Focusrite_Scarlett_Solo_USB_.*HiFi__Mic1__source" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]
