# Play the onboard sound card's Line In live through whatever the current
# default output is (Scarlett, or Bluetooth headphones when connected).
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Onboard Line In (monitor)"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name      = "linein_loopback.capture"
        target.object  = "alsa_input.pci-0000_2a_00.4.analog-stereo"
        node.passive   = false
        stream.dont-remix = true
      }
      playback.props = {
        node.name      = "linein_loopback.playback"
        media.class    = "Stream/Output/Audio"
        # no target.object: follows the default output
      }
    }
  }
]
